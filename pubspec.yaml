name: unic_sync
description: "Standalone desktop cloud sync application for Windows and Linux powered by the uSync engine."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5

  # Desktop Window & Tray Management
  # tray_manager: ^0.2.3  # Note: requires libayatana-appindicator3-dev on Linux
  window_manager: ^0.3.9

  # Storage & Utilities
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/bin/
